<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Sheet — Archive Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <p class="eyebrow">Roll 07 / Archive Scan</p>
    <h1>Contact&nbsp;Sheet</h1>
    <p class="sub">A working print of frames pulled from the field — sequenced, not curated. Filter by roll to isolate a set.</p>
    <div class="roll-count"><strong id="visibleCount">16</strong>frames visible</div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lb-inner">
      <button class="lb-close" id="lbClose" aria-label="Close viewer">✕</button>
      <button class="lb-prev" id="lbPrev" aria-label="Previous image">‹</button>
      <button class="lb-next" id="lbNext" aria-label="Next image">›</button>
      <div class="lb-frame">
        <img id="lbImg" src="" alt="">
      </div>
      <div class="lb-meta">
        <span class="lb-title" id="lbTitle"></span>
        <span class="lb-count" id="lbCount"></span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
